<div class="product-list-container">
  <!-- Search and Filters Section -->
  <div class="filters-section">
    <div class="search-bar">
      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        placeholder="Search products..." 
        class="search-input"
        (keyup.enter)="applyFilters()"
      >
      <button (click)="applyFilters()" class="search-btn">🔍</button>
    </div>

    <div class="filters">
      <div class="filter-group">
        <label>Category</label>
        <select [(ngModel)]="selectedCategoryId" (change)="applyFilters()">
          <option [value]="undefined">All Categories</option>
          <option *ngFor="let category of categories" [value]="category.categoryId">
  {{category.name}}
</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Price Range</label>
        <div class="price-inputs">
          <input 
            type="number" 
            [(ngModel)]="minPrice" 
            placeholder="Min ₹" 
            (change)="applyFilters()"
          >
          <span>-</span>
          <input 
            type="number" 
            [(ngModel)]="maxPrice" 
            placeholder="Max ₹"
            (change)="applyFilters()"
          >
        </div>
      </div>

      <div class="filter-group">
        <label>Minimum Rating</label>
        <select [(ngModel)]="minRating" (change)="applyFilters()">
          <option [value]="undefined">Any Rating</option>
          <option [value]="4">4+ Stars</option>
          <option [value]="3">3+ Stars</option>
          <option [value]="2">2+ Stars</option>
          <option [value]="1">1+ Stars</option>
        </select>
      </div>

      <button (click)="clearFilters()" class="clear-filters-btn">Clear All</button>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="loading">
    <p>Loading products...</p>
  </div>

  <!-- Products Grid -->
  <div *ngIf="!loading" class="products-grid">
    <div 
      *ngFor="let product of products" 
      class="product-card"
      [routerLink]="['/product', product.productId]"
    >
      <div class="product-image">
        <img 
          [src]="getImageUrl(product.imageFileName)" 
          [alt]="product.name"
          onerror="this.src='assets/images/placeholder.png'"
        >
      </div>
      
      <div class="product-info">
        <h3 class="product-name">{{ product.name }}</h3>
        <p class="product-category">{{ product.category }}</p>
        <div class="product-rating" *ngIf="product.rating">
          <span class="stars">{{ getStarRating(product.rating) }}</span>
          <span class="rating-number">({{ product.rating }})</span>
        </div>
        <p class="product-price">{{ formatPrice(product.price) }}</p>
      </div>
    </div>
  </div>

  <!-- No Products Found -->
  <div *ngIf="!loading && products.length === 0" class="no-products">
    <p>No products found matching your criteria.</p>
    <button (click)="clearFilters()">View All Products</button>
  </div>
</div>
